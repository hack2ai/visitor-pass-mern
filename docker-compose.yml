services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  server:
    build: ./server
    environment:
      MONGO_URI: mongodb://mongo:27017/visitor_pass
      JWT_SECRET: change_me_in_production
      CLIENT_URL: http://localhost:8080
    volumes: [uploads:/app/uploads]
    depends_on: [mongo]
  client:
    build: ./client
    ports: ["8080:80"]
    depends_on: [server]
volumes:
  mongo-data:
  uploads:
